[project]
name = "saspbft"
version = "0.1.0"
description = "Study about soft-prompt based fine-tuning"
readme = "README.md"
requires-python = "~=3.14.5"
dependencies = [
    "sentencepiece~=0.2",
    "scikit-learn~=1.8",
    "rouge-score~=0.1",
    "tiktoken~=0.12",
    "datasets~=4.8",
    "evaluate~=0.4",
    "mlflow~=3.10",
    "polars~=1.39",
    "click~=8.4",
    "rich~=15.0",
    "nltk~=3.9",
]

[dependency-groups]
dev = [
    "pytest-xdist",
    "pytest",
    "ruff",
    "ty",
]
notebooks = [
    "adjusttext~=1.3",
    "ipykernel~=7.3",
    "plotnine~=0.15",
    "plotly~=6.7",
    "ipython",
    "marimo",
]

[project.optional-dependencies]
cpu = [
    "flash-linear-attention~=0.4",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "torch~=2.13",
    "peft~=0.18",
]
cu132 = [
    "flash-linear-attention~=0.4",
    "causal-conv1d~=1.6",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "flash-attn~=2.8",
    "torch~=2.13",
    "peft~=0.18",
]

[project.scripts]
cli = "saspbft.scripts.cli:app"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "slow: heavy tests skipped by default; run with `pytest --run-slow`",
]
filterwarnings = [
    # raise warnings as errors
    "error::DeprecationWarning",
    "error::FutureWarning",
    "error::RuntimeWarning",
    "error::UserWarning",

    # internal
    "ignore:Token type ids are not supported:UserWarning",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # Trailing comma missing
    "CPY001",   # Missing copyright notice at top of file
    "D203",     # 1 blank line required before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "PLC0415",  # import should be at the top-level of a file 
    "PLR0913",  # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"{test}/**" = [
    "D103",     # Missing docstring in public function
    "FBT003",   # Boolean positional value in function call
    "S101",     # Use of assert detected
]

"{notebooks}/**" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN202",   # Missing return type annotation for private function
    "B018",     # Found useless expression.
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
    "ERA001",   # Found commented-out code
    "INP001",   # File is part of an implicit namespace package
    "PLR1711",  # Useless `return` statement at end of function
    "PLR0917",  # Too many positional arguments
]

[tool.uv]
exclude-newer = "2 days"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu132" },
    ],
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
