[project]
name = "instruct"
version = "0.1.0"
description = "Machine learning based language model prompting"
readme = "README.md"
requires-python = "==3.14.5"
dependencies = [
    "sentencepiece~=0.2",
    "scikit-learn~=1.8",
    "rouge-score~=0.1",
    "tiktoken~=0.12",
    "datasets~=4.8",
    "evaluate~=0.4",
    "mlflow~=3.10",
    "polars~=1.39",
    "typer~=0.27",
    "nltk~=3.9",
]

[dependency-groups]
dev = [
    "pytest-xdist~=3.8",
    "pytest~=9.0",
    "ruff",
    "ty",
]

[project.optional-dependencies]
cpu = [
    "flash-linear-attention~=0.4",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "torch~=2.10",
    "peft~=0.18",
]
cu128 = [
    "flash-linear-attention~=0.4",
    "causal-conv1d~=1.6",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "flash-attn~=2.8",
    "torch~=2.10",
    "peft~=0.18",
]
notebooks = [
    "adjusttext~=1.3",
    "plotnine~=0.15",
    "plotly~=6.7",
    "ipython",
    "marimo",
]

[project.scripts]
cli = "instruct.scripts.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Token type ids are not supported:UserWarning",
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:.*is multi-threaded, use of fork.*:DeprecationWarning",
]

[tool.ruff.lint]
select = [
    "F",        # pyflakes
    "E",        # pycodestyle: Error
    "W",        # pycodestyle: Warning
    "I",        # isort
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "PL",       # pylint
    "PERF",     # perflint
    "ANN",      # flake8 annotations
    "ASYNC",    # flake8-async
    "TID",      # flake8-tidy-imports
    "S",        # flake8-bandit
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "EM",       # flake8-errmsg
    "G",        # flake8-logging-format
    "PIE",      # flake8-pie
    "T20",      # flake8-print
    "PYI",      # flake8-pyi
    "PT",       # flake8-pytest-style
    "SIM",      # flake8-simplify
    "TC",       # flake8-tidy-checking
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "NPY",      # numpy
    "RUF",      # ruff
    "ERA",      # eradicate
    "TRY",      # tryceratops
]

ignore = [
    "D203",     # 1 blank line required before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "PLC0415",  # import should be at the top-level of a file 
    "PLR0913",  # Too many arguments in function definition
]

per-file-ignores = {"test/**" = [
    "S101",     # Use of assert detected
    "D103",     # Missing docstring in public function
], "notebooks/**" = [
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
    "ANN001",   # Missing type annotation for function argument
    "ANN202",   # Missing return type annotation for private function
    "T201",     # `print` found
    "B018",     # Found useless expression (marimo displays the last expression)
    "PLR0917",  # Too many positional arguments (marimo injects cell dependencies)
    "ERA001",   # Found commented-out code
]}

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
