[project]
name = "instruct"
version = "0.1.0"
description = "Machine learning based language model prompting"
readme = "README.md"
requires-python = "==3.14.5"
dependencies = [
    "sentencepiece==0.2.1",
    "scikit-learn==1.8.0",
    "rouge-score==0.1.2",
    "tiktoken==0.12.0",
    "datasets==4.8.4",
    "evaluate==0.4.6",
    "mlflow==3.10.1",
    "polars==1.39.3",
    "typer==0.24.1",
    "nltk==3.9.4",
]

[dependency-groups]
dev = [
    "pytest-xdist==3.8.0",
    "pytest==9.0.3",
    "ruff==0.15.20",
    "ty==0.0.54",
]

[project.optional-dependencies]
cpu = [
    "flash-linear-attention==0.4.2",
    "bitsandbytes==0.49.2",
    "transformers==5.5.2",
    "accelerate==1.13.0",
    "torch==2.10.0",
    "peft==0.18.1",
]
cu128 = [
    "flash-linear-attention==0.4.2",
    "causal-conv1d==1.6.1",
    "bitsandbytes==0.49.2",
    "transformers==5.5.2",
    "accelerate==1.13.0",
    "flash-attn==2.8.3",
    "torch==2.10.0",
    "peft==0.18.1",
]
notebooks = [
    "adjusttext==1.3.0",
    "plotnine==0.15.3",
    "ipython==9.11.0",
    "marimo==0.23.11",
    "plotly==6.7.0",
]

[project.scripts]
cli = "instruct.scripts.cli:app"

[build-system]
requires = ["hatchling==1.29"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Token type ids are not supported:UserWarning",
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:.*is multi-threaded, use of fork.*:DeprecationWarning",
]

[tool.ruff.lint]
select = ["A", "F", "E", "W", "I", "C4", "FA", "UP", "RUF", "SIM", "ARG"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
