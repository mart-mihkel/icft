name: ci

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - '**'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra cpu
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-hub-cache-${{ hashFiles('test/conftest.py') }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/datasets
          key: huggingface-datasets-cache-${{ hashFiles('**/datasets/*.py') }}

      - run: uv sync --frozen --extra cpu
      - run: uv run --no-sync pytest --run-slow --numprocesses auto
