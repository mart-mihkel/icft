[project]
name = "instruct"
version = "0.1.0"
description = "Machine learning based language model prompting"
readme = "README.md"
requires-python = "==3.14.5"
dependencies = [
    "sentencepiece~=0.2",
    "scikit-learn~=1.8",
    "rouge-score~=0.1",
    "tiktoken~=0.12",
    "datasets~=4.8",
    "evaluate~=0.4",
    "mlflow~=3.10",
    "polars~=1.39",
    "typer~=0.24",
    "nltk~=3.9",
]

[dependency-groups]
dev = [
    "pytest-xdist~=3.8",
    "pytest~=9.0",
    "ruff",
    "ty",
]

[project.optional-dependencies]
cpu = [
    "flash-linear-attention~=0.4",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "torch~=2.10",
    "peft~=0.18",
]
cu128 = [
    "flash-linear-attention~=0.4",
    "causal-conv1d~=1.6",
    "bitsandbytes~=0.49",
    "transformers~=5.5",
    "accelerate~=1.13",
    "flash-attn~=2.8",
    "torch~=2.10",
    "peft~=0.18",
]
notebooks = [
    "adjusttext~=1.3",
    "plotnine~=0.15",
    "plotly~=6.7",
    "ipython",
    "marimo",
]

[project.scripts]
cli = "instruct.scripts.cli:app"

[build-system]
requires = ["hatchling==1.29"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Token type ids are not supported:UserWarning",
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:.*is multi-threaded, use of fork.*:DeprecationWarning",
]

[tool.ruff.lint]
select = ["A", "F", "E", "W", "I", "C4", "FA", "UP", "RUF", "SIM", "ARG"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
